# Build the addin for MPC OS / Force and attach the zip to a DRAFT release, with mpc-vst-plugins' reusable workflow
# (its docs/ADDINS.md, "Releasing from CI"). mpc-vst-plugins is pinned to ONE commit in both places below, the same
# one as in test.yml.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the zip, addin.manifest and INSTALL.md, e.g. 0.1.0
        required: true
        type: string
      dry_run:
        description: Build and package only (the zip as a run artifact, no draft release)
        type: boolean
        default: false

jobs:
  addin:
    uses: sd88me/mpc-vst-plugins/.github/workflows/addin-release.yml@a4b8f861d07153a2b387d7520331f532f7247502
    permissions: { contents: write }
    with:
      tag: surface-addin-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: a4b8f861d07153a2b387d7520331f532f7247502
      package_dir: build/package
      build: sh tools/build_armhf.sh
      host_test: SKIP_INSTALL=1 sh tools/test_host.sh
      about: "Logs every message of the built-in control surface (buttons, pads, knobs). Monitoring only."
      license: MIT
      dry_run: ${{ inputs.dry_run }}
