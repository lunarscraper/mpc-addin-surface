# The offline tests on every push and pull request (host tests under the sanitizers, the installer in BusyBox) and the
# armhf build under QEMU, which enforces the glibc floor.
#
# mpc-vst-plugins is pinned to the same commit as release.yml. Move both pins together.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    name: Linux (host)
    steps:
      - uses: actions/checkout@v4
        with: { path: mpc-addin-surface }
      - uses: actions/checkout@v4
        with:
          repository: sd88me/mpc-vst-plugins
          ref: a4b8f861d07153a2b387d7520331f532f7247502
          path: mpc-vst-plugins
      - run: sudo apt-get install -y -q busybox
      - run: sh tools/test_host.sh
        working-directory: mpc-addin-surface
  armhf:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: armhf (MPC OS)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm }
      - run: sh tools/build_armhf.sh
